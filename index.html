<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>Dogs</title>
</head>

<body>
  <div class="Body-Container">
    <div id="header"></div>
    <div id="home">
      <section id="homeContent">
        <div class="leftHomeSide">
          <div>
            <p>The best place to buy top quality products for your pets</p>
            <p>Shop by pet, brand or products on sale!</p>
          </div>
          <div>
            <div>
              <input type="text" placeholder="What are you loking for?">
              <i class="fa-solid fa-magnifying-glass search-icon-right"></i>

            </div>
            <button>Search</button>
          </div>

        </div>

        <div class="rightHomeSide">
          <div>
            <img src="./images/dogs-1.jpg" alt="dogImage Note Found">
          </div>
        </div>
      </section>

      <section class="categories ">
        <h3>Categories</h3>
        <div class="categoriesSection">
          <div class="CatitemsFilter">
          </div>
          <div class="HomeProduct">
            <div class="SpecialOffers">
              <div class="SpecialOffersHead">
                <h3><i class="fa-solid fa-paw"></i> Special offers</h3>
              </div>

              <div class="SpecialItems">
                <div class="Special_item">
                  <div class="Special_item_head">
                    <h3>Dog Treats</h3>
                    <span>by Dr. Dogg</span>
                  </div>
                  <div class="Special_item_Img">
                    <div class="img-circle">

                      <img src="./images/dogs.png" alt="">
                    </div>
                    <div class="discountpop"> <span>30% OFF</span></div>
                  </div>
                  <button>Shop Now</button>
                </div>


                <div class="Special_item">
                  <div class="Special_item_head">

                    <h3>Dog Treats</h3>

                    <span>by Dr. Dogg</span>
                  </div>
                  <div class="Special_item_Img">
                    <img src="./images/dogs.png" alt="">
                  </div>
                  <button>Shop Now</button>
                </div>
              </div>
              <div class="adsFlashSale">
                <h4>FLASH SALE</h4>
                <span>End in </span>
                <div class="timer"></div>

              </div>
            </div>



            <div class="trendingProduct">
              <div class="trendingProductHead">
                <h3><i class="fa-solid fa-paw"></i> Trending products</h3>
              </div>
            </div>




            <div class="favoriteCategories">
              <div class="favoriteCategoriesHead">
                <h3><i class="fa-solid fa-paw"></i> Favorite categories</h3>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>



    <!--start blog section -->
    <section class="blogs">
      <h3>Read our blog</h3>
      <div class="blogArtic">

      </div>

    </section>
    <!-- end blog section -->
  </div>



  <!-- strt footer  -->
  <div class="footer"></div>

</body>
<script src="script.js"></script>
<script src="https://kit.fontawesome.com/317f1d8d0e.js" crossorigin="anonymous"></script>

</html>
