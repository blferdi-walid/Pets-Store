<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>Pets</title>
</head>

<body>
  <div class="Body-Container">
    <!-- start Contact  -->
    <header id="header"></header>

    <section class="shoppinCard">
      <p class="UrlCON"> contaier/dogs</p>
      <div class="shoppinCardContainer">
        <div class="shoppinList">
          <h2>Shoppin Cart</h2>
          <div class="cartList">
            <table id="cartTable">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Size</th>
                  <th>Quantity</th>
                  <th>Total price</th>
                  <th></th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>
                    <div class="cardItemImgSection">
                      <img src="./images/smallPet.png" alt="Hamster leash">
                      <div>
                        <h3>Hamster leash</h3>
                        <span>Pink</span>
                      </div>
                    </div>
                  </td>
                  <td>
                    <select class="cartSelect">
                      <option>1m</option>
                      <option selected>2m</option>
                      <option>3m</option>
                    </select>
                  </td>
                  <td><input class="cartQty" type="number" value="1" min="1"></td>
                  <td class="price">$ 7.29</td>
                  <td><i class="fa-solid fa-x removeItem"></i></td>
                </tr>
                <tr>
                  <td>
                    <div class="cardItemImgSection">
                      <img src="./images/smallPet.png" alt="Hamster leash">
                      <div>
                        <h3>Hamster leash</h3>
                        <span>Pink</span>
                      </div>
                    </div>
                  </td>
                  <td>
                    <select class="cartSelect">
                      <option>1m</option>
                      <option selected>2m</option>
                      <option>3m</option>
                    </select>
                  </td>
                  <td><input class="cartQty" type="number" value="1" min="1"></td>
                  <td class="price">$ 7.29</td>
                  <td><i class="fa-solid fa-x removeItem"></i></td>
                </tr>
              </tbody>

              <tfoot>
                <tr class="summaryRow">
                  <td colspan="2"></td>
                  <td class="label">
                    <p>Subtotal:</p>
                    <p>Shipping:</p>
                  </td>
                  <td class="price">
                    <p>$ 35.17</p>
                    <p>$ 2.00</p>
                  </td>
                  <td></td>
                </tr>
                <tr class="totalRow">
                  <td colspan="2"></td>
                  <td class="label">Total:</td>
                  <td class="price totalPrice">$ 37.17</td>
                  <td></td>
                </tr>
              </tfoot>
            </table>

          </div>
        </div>

        <div class="PaymentInfo" id="PaymentInfo" data-current-page="1"   data-max-page="2">
          <form class="PaymentInfoForm active"  data-page="1" >
            <h5 class="checkoutInfoTittl"> Checkout step 1/2</h5>
            <h3>Shipping Info </h3>
            <div class="formChild">
              <div>
                <label for="Name">Name</label>
                <input type="text">
              </div>
              <div>
                <label for="Surname">Surname</label>
                <input type="text">
              </div>
            </div>
            <div>
              <label>E-mail</label>
              <input type="text">
            </div>
            <div>
              <label>Phone Number</label>
              <input type="phone">
            </div>
            <div>
              <label>Street <Address></Address></label>
              <input type="text">
            </div>
            <div class="formChild">
              <div>
                <label>ZIP/Postal code</label>
                <input type="text">
              </div>
              <div class="">
                <label> Country</label>
                <select name="" id="CountryShippingOptions">
                  <option>Algeria</option>
                </select>
              </div>

            </div>
            <div class="checkboxForm">
              <input type="checkbox"> <span>Use as bilingg address</span>
            </div>
            <button class="ContinuPaymentBtn"> Continue to Payment ></button>
          </form> 


          <form class="PaymentInfoForm"  data-page="2">
            <h5 class="titlePaymentStep2 checkoutInfoTittl"> <button class="backHistory"> <i class="fa-solid fa-arrow-left-long"></i> </button> Checkout step 2/2</h5>
            <h3>Payment Info </h3>

            <div class="paymentMethodsBtns">
              <button id="CreditCardBtn" class="payment-btn" type="button">Credit Card</button>
              <button id="PayPalBtn" class="payment-btn" type="button">Pay pal</button>
            </div>
            <div>
              <label for="Surname">Cardholder Name</label>
              <input type="text">
            </div>
            <div>
              <label>Card Number</label>
              <input id="cardNumber" type="text" inputmode="numeric" placeholder="1234 5678 9012 3456" maxlength="19"
                autocomplete="cc-number">
            </div>

            <div class="CardInfoEXp">
              <div class="ExpirationDate">
                <label>ExpirationDate:</label>
                <div class="DateEXPInputs">
                  <select id="MonthCardEXP">
                    <option value="">MM</option>
                  </select>
                  <select id="YearCardEXP">
                    <option value="">YYYY</option>
                  </select>
                </div>
              </div>

              <div class="CVVCard">
                <label for="">CVV:</label>
                <input id="cvv" name="cvv" type="text" inputmode="numeric" placeholder="123" maxlength="4"
                  pattern="[0-9]{3,4}" autocomplete="cc-csc" >
              </div>

            </div>

            <button id="ConfirmPay"> Confirm and pay $ 37.17 </button>
          </form> 
        </div>


    </section>
  </div>
  <!-- End Contact  -->
  <div class="footer"></div>
  <script src="script.js"></script>
  <script src="https://kit.fontawesome.com/317f1d8d0e.js" crossorigin="anonymous"></script>
</body>

</html>
