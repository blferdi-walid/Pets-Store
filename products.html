<html lang="en">

<head>

<body>
  <div class="Body-Container">
    <!-- start Contact  -->
    <header id="header"></header>

    <section class="productPage">

      <nav class="breadcrumb"></nav>

      <div class="ProductsContainer">
    

          <div class="productsGrid">

          <div class="FilterBar">
            <div class="FilterBar_Left">
          </div>

            <div class="FilterBar_Right">
              <select id="sortSelect">
                <option value="disabled">--Sort By--</option>
                <option value="" disabled hidden>Sort by</option>
                <option value="increes">Price low</option>
                <option value="decrees">Price high</option>
              </select>
              <button> filterBtn</button>
            </div>
          </div>

          <div class="products"></div>
          <div class="LoadMoreSection"> <button id="LoadMore">Load more</button></div>

        </div>

      </div>

    </section>

  </div>
  <!-- End Contact  -->
  <div class="footer"></div>
