<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>Dogs</title>
</head>

<body>
  <div class="Body-Container">
    <!-- start Contact  -->
    <div id="header"></div>
    <div class="contact">
        <div class="parent">

          <div class="div1">
            <h3>Contact Information</h3>
            <div>
              <div class="phone">
                <span> <i class="fa-solid fa-phone"> </i>Phone</span>
                <span>+123 456 789 101</span>
                <span>+321 101 987 654</span>
              </div>
              <div class="Address">
                <span>
                  <i style="transform: rotate(0deg)" class="fa-solid fa-location-dot"></i>
                  Address</span>
                <span>717 Market Street </span>
                <span>San Francisco</span>
                <span>CA 94103</span>
              </div>
              <div class="email">
                <span><i style="transform: rotate(0deg)" class="fa-solid fa-envelope"></i>
                  E-mail</span>
                <span><a>petstore@uizard.com</a> </span>
              </div>
              <div class="Social">
                <span><i class="fa-solid fa-share-nodes"></i>Social</span>
                <div class="SocialLinks">
                  <span><a href=""><i class="fa-brands fa-instagram"></i></a></span>
                  <span><a href=""><i class="fa-brands fa-twitter"></i></a></span>
                </div>
              </div>
            </div>
          </div>

          <div class="div2">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d149002.02552234137!2d5.880752207002419!3d35.57707901484742!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12f41195bf2f909f%3A0x6e22f706efc7d3c0!2sBatna%2C%20Algeria!5e1!3m2!1sen!2sde!4v1785441350757!5m2!1sen!2sde"
              width="100%" height="100%" style="border: 0; border-radius: 10px" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>


          </div>

          <div class="div3">
            <h3>Send Us a Message</h3>
            <form action="">
              <div>
                <div>
                  <label for="">First Name</label>
                  <input type="text" placeholder="Anton">
                </div>
                <div>
                  <label for="">Last Name</label>
                  <input type="text" placeholder="Juan">
                </div>
              </div>
              <div>
                <label for="">E-mail</label>
                <input type="text" placeholder="example@gmail.com">
              </div>
              <div>
                <label>Message</label>
                <textarea name="" id=""> Type your message here ...</textarea>
              </div>
              <button>Send the message > </button>
            </form>

          </div>

        </div>
    </div>
  </div>
  <!-- End Contact  -->
  <div id="footer"></div>
</body>
<script src="script.js"></script>
<script src="https://kit.fontawesome.com/317f1d8d0e.js" crossorigin="anonymous"></script>

</html>
